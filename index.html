<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Fórmula Resolvente</title>
</head>
<body>

  <script>
    let repetir;

    do {
      // 1. Validação de dados: "a" não pode ser 0 nem inválido
      let a = Number(prompt("Valor de a:"));
      while (a === 0 || isNaN(a)) {
        alert("Erro: O valor de 'a' tem de ser um número diferente de 0.");
        a = Number(prompt("Valor de a:"));
      }

      let b = Number(prompt("Valor de b:"));
      while (isNaN(b)) {
        alert("Erro: Introduza um número válido para 'b'.");
        b = Number(prompt("Valor de b:"));
      }

      let c = Number(prompt("Valor de c:"));
      while (isNaN(c)) {
        alert("Erro: Introduza um número válido para 'c'.");
        c = Number(prompt("Valor de c:"));
      }

      // Cálculo do binómio discriminante (delta)
      let delta = b * b - 4 * a * c;

      if (delta >= 0) {
        // 2. Cálculo das raízes e arredondamento a 2 casas decimais
        let x1 = (-b + Math.sqrt(delta)) / (2 * a);
        let x2 = (-b - Math.sqrt(delta)) / (2 * a);

        // Evita o erro visual "-0.00" caso a raiz seja 0
        if (Math.abs(x1) < 1e-9) x1 = 0;
        if (Math.abs(x2) < 1e-9) x2 = 0;

        alert("x1 = " + x1.toFixed(2) + " e x2 = " + x2.toFixed(2));
      } else {
        alert("Não existem raízes reais.");
      }

      // 3. Pergunta ao utilizador se pretende repetir sem atualizar a página
      repetir = confirm("Deseja calcular outra equação?");

    } while (repetir);
  </script>

</body>
</html>
